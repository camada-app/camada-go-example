name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23.x", "1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v7
        with: { path: camada-go-example }
      # camada-go is a replace directive on the sibling checkout; the SDK embeds its own beacon build.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-go
          path: camada-go
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: gofmt -l . | (! grep .) && go vet ./... && go test ./...
        working-directory: camada-go-example
